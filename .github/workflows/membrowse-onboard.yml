name: Onboard to MemBrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '100'
        type: string
      target:
        description: 'Only onboard this target (empty for all targets)'
        required: false
        default: ''
        type: string

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load target matrix
        id: set-matrix
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          matrix=$(jq -c --arg t "$TARGET" 'if $t == "" then . else map(select(.target_name == $t)) end' .github/membrowse-targets.json)
          if [ "$matrix" = "[]" ]; then
            echo "::error::No target named '$TARGET' in .github/membrowse-targets.json"
            exit 1
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  onboard:
    needs: load-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Onboard iterates through historical commits, so it needs full history
          fetch-depth: 0
          # Submodules are initialized by setup_cmd and re-synced by build_cmd
          # for every historical commit.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install packages
        run: ${{ matrix.setup_cmd }}

      # Onboard runs `git clean -fdx` before every build, which deletes the
      # gitignored slc/tools (slt, zap and the .env that build.sh loads). Keep a
      # copy outside the checkout and put it back at the same path before each
      # build, so the absolute paths in .env stay valid.
      - name: Keep SLC tools outside the checkout
        run: cp -a slc/tools "${{ runner.temp }}/slc-tools"

      - name: Run MemBrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          num_commits: ${{ github.event.inputs.num_commits }}
          build_script: rm -rf slc/tools && cp -a "${{ runner.temp }}/slc-tools" slc/tools && ${{ matrix.build_cmd }}
          elf: ${{ matrix.elf }}
          ld: ${{ matrix.ld }}
          map_file: ${{ matrix.map_file }}
          linker_vars: ${{ matrix.linker_vars }}
          binary_search: 'true'
          # Heap is a fixed reservation that fills the remaining RAM, so it hides real usage.
          skip_sections: ${{ matrix.skip_sections }}
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
